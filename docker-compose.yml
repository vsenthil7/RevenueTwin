services:
  api:
    build: .
    restart: unless-stopped
    ports:
      - "8787:8787"
    environment:
      PORT: 8787
      # Durable Postgres backend. The pg driver is wired at the edge (src/edge/pg-factory.ts); on
      # boot the schema is applied and the demo portfolio is seeded only on a fresh database.
      DATABASE_URL: postgres://revenuetwin:changeme@db:5432/revenuetwin
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: revenuetwin
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: revenuetwin
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U revenuetwin"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
